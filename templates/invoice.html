{% extends 'base.html' %}{% block content %}<h1>Create test invoice</h1><section class="card"><form method="post"><div class="grid"><label>Language<select name="language"><option>English</option><option>French</option><option>German</option></select></label><label>Currency<input name="currency" value="EUR"></label><label>VAT rate %<input type="number" step="0.01" name="vat_rate" value="20"></label></div>{% for t in entries %}<label class="check"><input type="checkbox" name="entry_ids" value="{{t.id}}"> {{t.user.display_name}} | {{t.client.name}} | {{t.matter.name}} | {{t.services}} | {{t.amount}}</label>{% endfor %}<button>Issue test invoice</button></form></section>{% endblock %}
